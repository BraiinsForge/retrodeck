[package]
name = "retrodeck-native"
version = "1.0.0"
edition = "2024"
publish = false

[[bin]]
name = "retro-host"
path = "src/bin/retro-host/main.rs"
test = false

[[bin]]
name = "doom-host"
path = "src/bin/doom-host/main.rs"
test = false

[[bin]]
name = "tamagotchi-host"
path = "src/bin/tamagotchi-host/main.rs"
test = false

[[bin]]
name = "ten-seconds-deck"
path = "src/bin/ten-seconds-deck.rs"
test = false

[[bin]]
name = "compile-catalog"
path = "src/bin/compile-catalog.rs"
test = false

[[bin]]
name = "chiptune-deck"
path = "src/bin/chiptune-deck.rs"
test = false

[[bin]]
name = "deck-menu"
path = "src/bin/deck-menu.rs"
test = false

[[bin]]
name = "rom-uploader"
path = "src/bin/rom-uploader.rs"
test = false

[profile.release]
panic = "abort"
strip = true

[dependencies]
axum = { version = "=0.8.8", default-features = false, features = ["multipart", "http1", "tokio"] }
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
evdev = { version = "=0.13.2", default-features = false }
libc = "=0.2.189"
pbkdf2 = { version = "=0.12.2", default-features = false, features = ["hmac"] }
percent-encoding = "=2.3.2"
png = "=0.18.0"
rustix = { version = "=1.1.4", features = ["event", "fs", "mm", "time"] }
serde_urlencoded = "=0.7.1"
sha2 = { version = "=0.10.9", default-features = false }
subtle = { version = "=2.6.1", default-features = false }
tamalib = { path = "vendor/tamalib-rs" }
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std"] }
tokio = { version = "=1.49.0", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
wayland-backend = "=0.3.15"
wayland-client = "=0.31.14"
wayland-scanner = "=0.31.11"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
wayland-server = "=0.31.14"
